name: Container images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check UI
        working-directory: ui
        run: |
          docker compose -f ../docker-compose.yml config --quiet
          docker compose -f ../docker-compose.develop.yml config --quiet
          npm ci
          npm run typecheck
          npm test
          npm run test:runtime
          node node_modules/playwright-core/cli.js install --with-deps chromium
          node --input-type=module -e 'import {chromium} from "playwright-core"; console.log("BROWSER_EXECUTABLE=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v6
        with:
          context: ui
          platforms: linux/amd64
          load: true
          tags: bzcard-ui:distribution-test
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      - name: Verify the same image at multiple public paths
        working-directory: ui
        run: npm run test:container

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: api/Dockerfile
          - service: kana
            dockerfile: api/Dockerfile.kana
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v6
        with:
          context: api
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: bzcard-${{ matrix.service }}:distribution-test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: API regressions
        if: matrix.service == 'api'
        run: |
          docker run --rm --network none -v "$PWD/api:/review:ro" -w /review \
            -e DATA_DIR=/tmp/bzcard-test -e PYTHONPATH=/review \
            bzcard-api:distribution-test python -B -m unittest discover -p 'test_*.py'
      - name: Kana import check
        if: matrix.service == 'kana'
        run: docker run --rm --network none bzcard-kana:distribution-test python -B -c 'import model; from pathlib import Path; compile(Path("server.py").read_text(), "server.py", "exec")'

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ui, services]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: ui
            context: ui
            dockerfile: ui/Dockerfile
          - service: api
            context: api
            dockerfile: api/Dockerfile
          - service: kana
            context: api
            dockerfile: api/Dockerfile.kana
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/bzcard-$SERVICE" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7 # v5
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
