server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The entry document references content-hashed assets. Never cache it, or a
  # browser can request an asset from a previous deployment and receive HTML.
  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  # This placeholder is filled from VITE_BASE_PATH when the image is built.
  # Keep it aligned with Vite's asset URLs when an installation uses a
  # different subpath (for example, /bzcard-demo/).
  location __BASE_PATH__/ {
    rewrite ^__BASE_PATH__/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
