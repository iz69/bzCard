server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The entry document references content-hashed assets. Never cache it, or a
  # browser can request an asset from a previous deployment and receive HTML.
  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  location /bzcard/ {
    rewrite ^/bzcard/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
